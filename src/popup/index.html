<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindGit</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="app-shell">
  <header class="header" aria-label="MindGit">
    <div class="brand-lockup">
      <span class="brand-mark" aria-hidden="true">MG</span>
      <div class="brand-copy">
        <span class="brand-eyebrow" id="brandEyebrow">BROWSE PATHS</span>
        <h1><span id="appName">MindGit</span></h1>
      </div>
      <span class="recording-state" id="recordingState" title="正在记录网页跳转">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="recordingStateText">记录中</span>
      </span>
    </div>
    <div class="header-actions">
      <button id="themeBtn" class="icon-btn" type="button" title="切换主题" aria-label="切换主题">◐</button>
      <button id="refreshBtn" class="icon-btn" type="button" title="刷新" aria-label="刷新">↻</button>
      <button id="newSessionBtn" class="icon-btn" type="button" title="新建会话" aria-label="新建会话">＋</button>
      <button id="searchBtn" class="icon-btn" type="button" title="搜索" aria-label="搜索">⌕</button>
      <button id="exportBtn" class="icon-btn" type="button" title="导出" aria-label="导出会话">↗</button>
      <button id="settingsBtn" class="icon-btn" type="button" title="设置" aria-label="设置">⚙</button>
    </div>
  </header>

  <!-- 会话列表 -->
  <section class="session-list-container" id="sessionListContainer" aria-labelledby="sessionListTitle">
    <div class="session-list-header" id="sessionListHeader" role="button" tabindex="0" aria-expanded="false" aria-controls="sessionList">
      <div class="session-list-title-wrapper">
        <span class="session-list-toggle" id="sessionListToggle" aria-hidden="true">▾</span>
        <span class="session-list-title" id="sessionListTitle">会话列表</span>
      </div>
      <span class="session-list-count" id="sessionCount">0 个</span>
    </div>
    <div class="session-list" id="sessionList">
      <!-- 会话项目将在这里动态生成 -->
    </div>
  </section>

  <section class="workspace-strip" aria-label="当前工作区">
    <div class="workspace-context">
      <span class="workspace-kicker" id="workspaceLabel">当前工作区</span>
      <strong class="workspace-name" id="activeSessionName">无活动会话</strong>
    </div>
    <span class="view-mode-badge" id="viewModeBadge">TREE</span>
  </section>

  <div class="stats-bar" id="statsInfo" aria-live="polite">
    <span id="noActiveSession">无活动会话</span>
  </div>

  <section class="tree-container" id="treeContainer" aria-label="浏览记录" aria-live="polite">
    <div class="empty-state">
      <div class="empty-icon" aria-hidden="true">+</div>
      <p id="noRecords">还没有浏览记录</p>
      <p class="empty-hint" id="startBrowsing">开始浏览网页，我会帮你记录跳转脉络~</p>
    </div>
  </section>

  <footer class="footer">
    <button id="clearAllBtn" class="text-btn danger" type="button" data-i18n="clearAll">清空所有</button>
    <div class="footer-actions">
      <button id="expandAllBtn" class="text-btn" data-i18n="expandAll">全部展开</button>
      <button id="collapseAllBtn" class="text-btn" data-i18n="collapseAll">全部折叠</button>
    </div>
  </footer>
  </main>

  <!-- 设置面板 -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="settingsTitle">设置</h2>
        <button class="close-btn" id="closeSettings">&times;</button>
      </div>
      <div class="modal-body">
        <div class="settings-section-title" id="settingsTrackingSection">记录</div>
        <div class="setting-item tracking-setting">
          <div class="tracking-setting-copy">
            <span class="setting-label" id="labelTrackingEnabled">网页记录</span>
            <small class="setting-description" id="trackingHint">记录当前标签页的网页跳转</small>
          </div>
          <button
            id="trackingToggle"
            class="tracking-toggle"
            type="button"
            aria-pressed="true"
            title="停用网页记录"
          >
            <span class="tracking-toggle-indicator" aria-hidden="true"></span>
            <span id="trackingToggleText">已启用</span>
          </button>
        </div>
        <div class="setting-item">
          <label>
            <span id="labelMaxSessions">最大保存会话数</span>
            <input type="number" id="maxSessions" min="5" max="200" value="50">
          </label>
        </div>
        <div class="setting-item">
          <label>
            <span id="labelAutoClean">自动清理旧会话</span>
            <input type="checkbox" id="autoClean" checked>
          </label>
        </div>
        <div class="settings-section-title" id="settingsAppearanceSection">界面</div>
        <div class="setting-item">
          <label>
            <span id="labelShowFavicons">显示网站图标</span>
            <input type="checkbox" id="showFavicons" checked>
          </label>
        </div>
        <div class="setting-item">
          <label>
            <span id="labelDefaultExpand">树形结构默认展开</span>
            <input type="checkbox" id="defaultExpand" checked>
          </label>
        </div>
        <div class="setting-item">
          <label>
            <span id="labelAutoCreateSession">自动创建会话并记录当前页面</span>
            <input type="checkbox" id="autoCreateSession" checked>
          </label>
        </div>
        <div class="setting-item">
          <label>
            <span id="labelLanguage">语言</span>
            <span class="settings-select-wrap">
              <select id="language">
                <option value="zh">简体中文</option>
                <option value="en">English</option>
              </select>
            </span>
          </label>
        </div>
        <div class="setting-item">
          <label>
            <span id="labelColorTheme">配色主题</span>
            <span class="settings-select-wrap">
              <select id="colorTheme">
                <option value="default" id="themeDefault">默认蓝</option>
                <option value="morandi" id="themeMorandi">莫兰迪</option>
                <option value="forest" id="themeForest">森林绿</option>
                <option value="ocean" id="themeOcean">海洋蓝</option>
                <option value="warm" id="themeWarm">暖阳橙</option>
                <option value="dark" id="themeDark">暗色模式</option>
              </select>
            </span>
          </label>
        </div>
        <div class="setting-item">
          <label>
            <span id="labelSortMode">节点排序</span>
            <span class="settings-select-wrap">
              <select id="sortMode">
                <option value="smart" id="sortSmart">智能综合排序</option>
                <option value="time" id="sortByTime">最近访问优先</option>
                <option value="children" id="sortByChildren">子节点数量优先</option>
                <option value="visits" id="sortByVisits">访问次数优先</option>
              </select>
            </span>
          </label>
        </div>
        <div class="setting-item">
          <label>
            <span id="labelViewMode">视图模式</span>
            <span class="settings-select-wrap">
              <select id="viewMode">
                <option value="tree" id="viewTree">树形视图</option>
                <option value="timeline" id="viewTimeline">时间线视图</option>
              </select>
            </span>
          </label>
        </div>
        <div class="settings-section-title" id="settingsDataSection">数据</div>
        <div class="setting-item setting-item-full">
          <span id="labelExport">导出会话</span>
          <button id="exportSettingBtn" class="secondary-btn" data-i18n="exportCurrentSessionBtn">导出当前会话</button>
        </div>
        
        <!-- GitHub Gist 同步配置 -->
        <div class="setting-divider"></div>
        <div class="setting-item setting-item-full">
          <span><span id="labelCloudSync">云端同步</span> <small id="syncStatusText"></small></span>
          <div class="sync-action-group">
            <button id="configureTokenBtn" class="secondary-btn">配置 Token</button>
            <button id="uploadToCloudBtn" class="secondary-btn" style="display: none;">上传</button>
            <button id="downloadFromCloudBtn" class="secondary-btn" style="display: none;">下载</button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <a href="#" id="aboutLink" class="about-link">关于</a>
        <button id="saveSettings" class="primary-btn" data-i18n="save">保存设置</button>
      </div>
    </div>
  </div>

  <!-- 关于对话框 -->
  <div class="modal" id="aboutModal">
    <div class="modal-content about-modal-content">
      <div class="modal-header">
        <h2>关于</h2>
        <button class="close-btn" id="closeAbout">&times;</button>
      </div>
      <div class="about-body">
        <div class="about-header">
          <span class="about-icon">MG</span>
          <div class="about-title">
            <h3>MindGit</h3>
            <span class="about-version">v1.3</span>
          </div>
        </div>
        <div class="about-links">
          <a href="https://github.com/rumialunnar/MindGit" target="_blank" class="about-link-btn">
            <span class="about-link-mark" aria-hidden="true">GH</span> GitHub
          </a>
          <a href="https://github.com/rumialunnar" target="_blank" class="about-link-btn">
            <span class="about-link-mark" aria-hidden="true">@</span> 作者
          </a>
        </div>
        <p class="about-footer">由 rumialunnar 制作</p>
      </div>
    </div>
  </div>

  <!-- 新建会话对话框 -->
  <div class="modal" id="newSessionModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="newSessionTitle">新建会话</h2>
        <button class="close-btn" id="closeNewSession">&times;</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label id="newSessionLabel">会话名称（可选）</label>
          <input type="text" id="newSessionName" placeholder="例如：知乎深度阅读、技术调研...">
        </div>
      </div>
      <div class="modal-footer">
        <button id="confirmNewSession" class="primary-btn" data-i18n="create">创建会话</button>
      </div>
    </div>
  </div>

  <!-- 配置 Token 对话框 -->
  <div class="modal" id="tokenConfigModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>配置 GitHub Token</h2>
        <button class="close-btn" id="closeTokenConfig">&times;</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label>GitHub Personal Access Token</label>
          <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
          <small style="color: var(--text-muted); margin-top: 6px; display: block;">
            在 <a href="https://github.com/settings/tokens/new" target="_blank" style="color: var(--primary-color);">GitHub Settings</a> 创建，勾选 <strong>gist</strong> 权限
          </small>
        </div>
        <div id="tokenValidationResult" style="margin-top: 12px; font-size: 13px;"></div>
      </div>
      <div class="modal-footer">
        <button id="clearTokenBtn" class="secondary-btn" style="margin-right: auto;">清除</button>
        <button id="saveTokenBtn" class="primary-btn">保存</button>
      </div>
    </div>
  </div>

  <!-- 重命名会话对话框 -->
  <div class="modal" id="renameSessionModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="renameSessionTitle">重命名会话</h2>
        <button class="close-btn" id="closeRenameSession">&times;</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label id="renameSessionLabel">会话名称</label>
          <input type="text" id="renameSessionInput" placeholder="输入新的会话名称...">
        </div>
      </div>
      <div class="modal-footer">
        <button id="confirmRenameSession" class="primary-btn" data-i18n="save">保存</button>
      </div>
    </div>
  </div>

  <!-- 搜索对话框 -->
  <div class="modal" id="searchModal">
    <div class="modal-content search-modal-content">
      <div class="modal-header">
        <h2 id="searchTitle">搜索</h2>
        <button class="close-btn" id="closeSearch">&times;</button>
      </div>
      <div class="modal-body">
        <div class="search-input-wrapper">
          <input type="text" id="searchInput" placeholder="搜索会话和节点..." />
          <div class="search-nav" id="searchNav" style="display: none;">
            <span id="searchCount">0/0</span>
            <button class="search-nav-btn" id="prevResult">↑</button>
            <button class="search-nav-btn" id="nextResult">↓</button>
          </div>
        </div>
        <div class="search-results-list" id="searchResultsList"></div>
      </div>
    </div>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
